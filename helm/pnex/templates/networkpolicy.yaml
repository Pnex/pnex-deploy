{{- if .Values.networkPolicy.enabled }}
# Data stores accept connections from PNeX pods only: Valkey (no TLS),
# OpenObserve (root credentials) and RustFS. Rauthy and the API stay
# reachable from the ingress controller; Postgres is left to CloudNativePG.
{{- $ctx := . }}
{{- $stores := list (list "valkey" "redis" (list "api" "flow-worker" "worker"))
                       (list "openobserve" "http" (list "api" "flow-worker" "worker"))
                       (list "rustfs" "s3" (list "api" "flow-worker" "worker" "rustfs-bucket")) }}
{{- if .Values.searxng.enabled }}
{{- $stores = append $stores (list "searxng" "http" (list "api" "flow-worker")) }}
{{- end }}
{{- range $store := $stores }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pnex.fullname" $ctx }}-{{ index $store 0 }}
  labels:
    {{- include "pnex.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pnex.selector" (list $ctx (index $store 0)) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/instance, operator: In, values: [{{ $ctx.Release.Name | quote }}] }
              - { key: app.kubernetes.io/name, operator: In, values: {{ index $store 2 | toJson }} }
      ports:
        - port: {{ index $store 1 }}
{{- end }}
{{- end }}
