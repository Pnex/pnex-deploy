# PostgreSQL through the CloudNativePG operator. The operator generates the
# `<cluster>-app` secret (user `pnex`, key `uri`) read by the API and worker.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "pnex.pgCluster" . }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  bootstrap:
    initdb:
      database: pnex
      owner: pnex
      # A new cluster has the extensions before the first migration runs.
      postInitApplicationSQL:
        {{- range .Values.postgres.extensions }}
        - CREATE EXTENSION IF NOT EXISTS {{ . }};
        {{- end }}
  # The server's migrations grant this role what it may read, so it exists
  # before them; it only logs in when the pipeline worker runs.
  managed:
    roles:
      - name: pnex_pipeline_worker
        ensure: present
        {{- if .Values.pipelineWorker.enabled }}
        login: true
        connectionLimit: 10
        passwordSecret:
          name: {{ include "pnex.fullname" . }}-pipeline-worker-db
        {{- else }}
        login: false
        {{- end }}
  storage:
    size: {{ .Values.postgres.size }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  postgresql:
    parameters:
      {{- range $k, $v := .Values.postgres.parameters }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
---
# The same extensions on an existing cluster, kept present by the operator
# (CNPG Database, declarative extensions). `retain`: deleting this object
# never drops the database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "pnex.pgCluster" . }}-pnex
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
spec:
  name: pnex
  owner: pnex
  cluster:
    name: {{ include "pnex.pgCluster" . }}
  databaseReclaimPolicy: retain
  extensions:
    {{- range .Values.postgres.extensions }}
    - name: {{ . }}
      ensure: present
    {{- end }}
