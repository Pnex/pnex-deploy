# Telemetry store: one OpenObserve org per PNeX org, provisioned by the API.
{{- $name := printf "%s-openobserve" (include "pnex.fullname" .) }}
{{- $o2 := .Values.openobserve }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
    {{- include "pnex.selector" (list . "openobserve") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "pnex.selector" (list . "openobserve") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pnex.selector" (list . "openobserve") | nindent 8 }}
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      containers:
        - name: openobserve
          image: {{ $o2.image }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: ZO_ROOT_USER_EMAIL, value: {{ $o2.rootEmail | quote }} }
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "pnex.secretName" . }}, key: o2-root-password }
            - { name: ZO_DATA_DIR, value: /data }
            - { name: RUST_LOG, value: {{ .Values.logLevel | quote }} }
            - { name: ZO_TELEMETRY, value: "false" }
            - { name: ZO_USAGE_REPORTING_ENABLED, value: "false" }
            - { name: ZO_MEMORY_CACHE_MAX_SIZE, value: {{ $o2.memoryCacheMaxSize | quote }} }
            - { name: ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE, value: {{ $o2.memoryCacheDatafusionMaxSize | quote }} }
            - { name: ZO_MEM_TABLE_MAX_SIZE, value: {{ $o2.memTableMaxSize | quote }} }
            - { name: ZO_MAX_FILE_SIZE_IN_MEMORY, value: {{ $o2.maxFileSizeInMemory | quote }} }
            - { name: ZO_DISK_CACHE_MAX_SIZE, value: {{ $o2.diskCacheMaxSize | quote }} }
          ports:
            - { name: http, containerPort: 5080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $o2.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "pnex.persistence" $o2.persistence | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pnex.selector" (list . "openobserve") | nindent 4 }}
  ports:
    - { name: http, port: 5080, targetPort: http }
