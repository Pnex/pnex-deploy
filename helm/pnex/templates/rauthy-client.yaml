{{- /*
The bootstrap clients.json only applies on Rauthy's first init: this hook
puts the canonical `pnex` client on every install and upgrade, so new
settings reach existing installs (MCP sign-in: loopback callback and the
RFC 8707 resource of /api/v1/mcp).
*/ -}}
{{- $name := printf "%s-rauthy-client" (include "pnex.fullname" .) }}
{{- $host := .Values.publicHost }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: client
          image: {{ .Values.rauthy.branding.image }}
          {{- include "pnex.containerSecurity" . | nindent 10 }}
          env:
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "pnex.secretName" . }}, key: rauthy-api-key-secret }
            - { name: BASE, value: "http://{{ include "pnex.fullname" . }}-rauthy:8080/auth/v1" }
          command:
            - sh
            - -c
            - |
              set -e
              # PROXY_MODE: a request without a client address is refused.
              rcurl() { curl -H 'X-Forwarded-For: 127.0.0.1' "$@"; }
              until rcurl -sf -o /dev/null "$BASE/.well-known/openid-configuration"; do
                echo "rauthy not ready, retrying..."; sleep 3
              done
              dollar='$'
              auth="Authorization: API-Key pnex-install${dollar}${API_KEY_SECRET}"
              cat >/tmp/client.json <<'EOF'
              {
                "id": "pnex",
                "name": "PNeX",
                "enabled": true,
                "confidential": false,
                "redirect_uris": [
                  "https://{{ $host }}/auth/callback",
                  "https://{{ $host }}/api/v1/oauth2/native",
                  "pnex://auth/callback",
                  "http://localhost:33418/callback"
                ],
                "post_logout_redirect_uris": ["https://{{ $host }}/"],
                "allowed_origins": ["https://{{ $host }}"],
                "allowed_resources": ["https://{{ $host }}/api/v1/mcp"],
                "flows_enabled": ["authorization_code", "refresh_token"],
                "access_token_alg": "RS256",
                "id_token_alg": "RS256",
                "auth_code_lifetime": 300,
                "access_token_lifetime": 3600,
                "scopes": ["openid", "profile", "email"],
                "default_scopes": ["openid", "profile", "email"],
                "challenges": ["S256"],
                "force_mfa": false,
                "client_uri": "https://{{ $host }}"
              }
              EOF
              rcurl -sfS -o /dev/null -X PUT -H "$auth" -H 'Content-Type: application/json' \
                --data-binary @/tmp/client.json "$BASE/clients/pnex"
              echo "Rauthy client pnex up to date"
