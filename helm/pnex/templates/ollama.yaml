# Optional local LLM on CPU an org can declare as its AI provider (kind
# ollama, address http://<release>-ollama:11434). Internal only: no Ingress,
# only the API and flow workers connect. Models kept on a volume.
{{- if .Values.ollama.enabled }}
{{- $name := printf "%s-ollama" (include "pnex.fullname" .) }}
{{- $env := list (dict "name" "HOME" "value" "/data") (dict "name" "OLLAMA_MODELS" "value" "/data/models") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
    {{- include "pnex.selector" (list . "ollama") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "pnex.selector" (list . "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pnex.selector" (list . "ollama") | nindent 8 }}
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Pulls the models before the server is ready; a no-op once they
        # are on the volume and up to date.
        - name: pull
          image: {{ .Values.ollama.image }}
          {{- include "pnex.containerSecurity" . | nindent 10 }}
          env: {{ $env | toJson }}
          command: ["sh", "-c"]
          args:
            - |
              ollama serve & pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for m in {{ join " " .Values.ollama.models }}; do ollama pull "$m" || exit 1; done
              kill $pid
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          {{- include "pnex.containerSecurity" . | nindent 10 }}
          env:
            {{- toYaml $env | nindent 12 }}
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            # Keeps the model in memory: a CPU reload costs seconds per call.
            - { name: OLLAMA_KEEP_ALIVE, value: {{ .Values.ollama.keepAlive | quote }} }
          ports:
            - { name: http, containerPort: 11434 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "pnex.persistence" .Values.ollama.persistence | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pnex.selector" (list . "ollama") | nindent 4 }}
  ports:
    - { name: http, port: 11434, targetPort: http }
{{- end }}
