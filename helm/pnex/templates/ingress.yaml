{{- if .Values.ingress.enabled }}
{{- $fullname := include "pnex.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
  annotations:
    {{- include "pnex.ingressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts: [{{ $.Values.publicHost | quote }}]
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /auth/v1/
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-rauthy
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port: { name: http }
---
# Websockets on their own Ingress (no access log by default: the
# browser's notification socket reconnects often). Devices never come this
# way: they use the device endpoint (templates/device-edge.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-ws
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
  annotations:
    {{- include "pnex.ingressAnnotations" . | nindent 4 }}
    {{- if not .Values.ingress.wsAccessLog }}
    {{- if contains "nginx" .Values.ingress.className }}
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    {{- else if contains "traefik" .Values.ingress.className }}
    traefik.ingress.kubernetes.io/router.observability.accesslogs: "false"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts: [{{ $.Values.publicHost | quote }}]
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-api
                port: { name: http }
{{- end }}
