{{- if not .Values.secrets.existingSecret }}
{{- $name := include "pnex.secretName" . }}
{{- $s := .Values.secrets }}
{{- /* Precedence: value from values.yaml > value already in the cluster >
     freshly generated random value. */}}
{{- $old := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $old = .data | default dict }}
{{- end }}
{{- $entries := list
  (list "admin-password" $s.adminPassword (randAlphaNum 24))
  (list "o2-root-password" $s.o2RootPassword (printf "O2x%sZ9!" (randAlphaNum 32)))
  (list "notify-internal-token" $s.notifyInternalToken (randAlphaNum 64))
  (list "flow-runtime-token" $s.flowRuntimeToken (randAlphaNum 64))
  (list "flow-cluster-token" $s.flowClusterToken (randAlphaNum 64))
  (list "secrets-keys" $s.secretsKeys (printf "k1:%s" (randBytes 32)))
  (list "valkey-password" $s.valkeyPassword (randAlphaNum 48))
  (list "rustfs-access-key" $s.rustfsAccessKey (randAlphaNum 20))
  (list "rustfs-secret-key" $s.rustfsSecretKey (randAlphaNum 40))
  (list "rauthy-secret-raft" $s.rauthySecretRaft (randAlphaNum 48))
  (list "rauthy-secret-api" $s.rauthySecretApi (randAlphaNum 48))
  (list "rauthy-enc-key-id" $s.rauthyEncKeyId (printf "k%s" (randAlphaNum 7 | lower)))
  (list "rauthy-enc-key" $s.rauthyEncKey (randBytes 32))
  (list "rauthy-api-key-secret" $s.rauthyApiKeySecret (randAlphaNum 64))
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $entries }}
  {{- $key := index . 0 }}
  {{- if index . 1 }}
  {{ $key }}: {{ index . 1 | toString | b64enc }}
  {{- else if hasKey $old $key }}
  {{ $key }}: {{ index $old $key }}
  {{- else }}
  {{ $key }}: {{ index . 2 | b64enc }}
  {{- end }}
  {{- end }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | toString | b64enc }}
  {{- end }}
{{- end }}
