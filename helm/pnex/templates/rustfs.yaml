# S3-compatible object store: firmware artefacts + media.
{{- $name := printf "%s-rustfs" (include "pnex.fullname" .) }}
{{- $secret := include "pnex.secretName" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
    {{- include "pnex.selector" (list . "rustfs") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "pnex.selector" (list . "rustfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pnex.selector" (list . "rustfs") | nindent 8 }}
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-access-key }
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-secret-key }
            - { name: RUST_LOG, value: {{ .Values.logLevel | quote }} }
            - { name: RUSTFS_OBS_LOGGER_LEVEL, value: {{ .Values.logLevel | quote }} }
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "pnex.persistence" .Values.rustfs.persistence | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pnex.selector" (list . "rustfs") | nindent 4 }}
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
---
# One-shot, idempotent bucket creation.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-bucket
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "pnex.selector" (list . "rustfs-bucket") | nindent 8 }}
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: {{ .Values.rustfs.initImage }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-access-key }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-secret-key }
            - { name: AWS_DEFAULT_REGION, value: {{ .Values.rustfs.region | quote }} }
            - { name: BUCKET, value: {{ .Values.rustfs.bucket | quote }} }
            - { name: ENDPOINT, value: "http://{{ $name }}:9000" }
            {{- if .Values.pipelineWorker.enabled }}
            # The pipeline worker's own identity: datasets only, never media
            # or documents (security.md SEC-61).
            - name: WORKER_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-pipeline-access-key }
            - name: WORKER_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: rustfs-pipeline-secret-key }
            {{- end }}
          command:
            - sh
            - -c
            - |
              until aws --endpoint-url "$ENDPOINT" s3 ls >/dev/null 2>&1; do
                echo "rustfs not ready, retrying..."; sleep 3
              done
              aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET" 2>/dev/null \
                || aws --endpoint-url "$ENDPOINT" s3api create-bucket --bucket "$BUCKET"
              echo "bucket $BUCKET ready"
              {{- if .Values.pipelineWorker.enabled }}
              admin() {
                curl -fsS --aws-sigv4 "aws:amz:$AWS_DEFAULT_REGION:s3" \
                  --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" -X PUT "$@"
              }
              admin --data-binary @- "$ENDPOINT/rustfs/admin/v3/add-canned-policy?name=pnex-pipeline-worker" <<EOF
              {"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],
                 "Resource":["arn:aws:s3:::$BUCKET/org_*/datasets/*"]},
                {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::$BUCKET"],
                 "Condition":{"StringLike":{"s3:prefix":["org_*/datasets/*"]}}}]}
              EOF
              printf '{"secretKey":"%s","status":"enabled"}' "$WORKER_SECRET_KEY" \
                | admin --data-binary @- "$ENDPOINT/rustfs/admin/v3/add-user?accessKey=$WORKER_ACCESS_KEY"
              admin "$ENDPOINT/rustfs/admin/v3/set-user-or-group-policy?policyName=pnex-pipeline-worker&userOrGroup=$WORKER_ACCESS_KEY&isGroup=false"
              echo "pipeline worker identity ready"
              {{- end }}
