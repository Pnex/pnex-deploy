# pnex-builder: queue worker (PlatformIO firmware builds, 360° stitching).
# Media and artefacts go through RustFS: no shared volume with the API.
{{- $name := printf "%s-worker" (include "pnex.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pnex.labels" . | nindent 4 }}
    {{- include "pnex.selector" (list . "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "pnex.selector" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pnex.selector" (list . "worker") | nindent 8 }}
    spec:
      {{- include "pnex.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: pnex-builder
          image: "{{ .Values.image.registry }}/pnex-builder-rs:{{ include "pnex.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start", "--worker"]
          {{- include "pnex.containerSecurity" . | nindent 10 }}
          env:
            {{- include "pnex.appEnv" . | nindent 12 }}
            # The API alone migrates the schema: two concurrent migrators
            # collide on CREATE TYPE/TABLE.
            - { name: PNEX_AUTO_MIGRATE, value: "false" }
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with (include "pnex.deviceCaMount" .) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with (include "pnex.deviceCaVolume" .) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
