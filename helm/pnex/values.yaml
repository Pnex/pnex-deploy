# ── pnex-builder (queue worker: PlatformIO builds, 360° stitching) ──────
worker:
  replicas: 1
  stitchMaxConcurrent: 2
  stitchOutWidth: 4096
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 4Gi }
  extraEnv: []

# ── PostgreSQL (CloudNativePG operator must be installed) ───────────────
postgres:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  size: 5Gi
  storageClass: ""
  parameters:
    shared_buffers: 256MB
    effective_cache_size: 1GB
    work_mem: 4MB
    maintenance_work_mem: 64MB
    max_connections: "100"
    checkpoint_timeout: 15min
    wal_compression: "on"
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# ── Valkey (presence leases, device bus, live cache — no persistence) ────
valkey:
  image: valkey/valkey:9-alpine
  maxmemory: 128mb
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

# ── Rauthy (OpenID Connect provider, served on /auth/v1/) ───────────────
rauthy:
  image: ghcr.io/sebadob/rauthy:0.36.2
  # Ranges Rauthy trusts X-Forwarded-For from (newline separated): the pod
  # CIDR of the ingress controller and of the chart's own jobs. Default: the
  # private ranges, which cover every CNI (k3s 10.42/16, microk8s 10.1/16,
  # kind 10.244/16...). Narrow it to the pod CIDR on a shared cluster.
  # Untrusted peers get "Invalid IP Address" (login broken).
  trustedProxies: "10.0.0.0/8\n172.16.0.0/12\n192.168.0.0/16"
  # Header carrying the real client IP when a CDN sits in front of the
  # ingress (e.g. "CF-Connecting-IP" behind Cloudflare). Without it, sessions
  # are bound to the CDN edge IP, which changes between requests and breaks
  # login. Only set it if the origin is reachable exclusively through the CDN.
  peerIpHeader: ""
  # Self-registration needs working mail (activation link). Defaults to
  # smtp.enabled when left empty.
  registration: ""
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Post-install/upgrade job: PNeX theme + logos on the login pages.
  branding:
    enabled: true
    image: curlimages/curl:8.16.0

# ── OpenObserve (telemetry, logs, events) ───────────────────────────────
openobserve:
  image: openobserve/openobserve:v1.0.0
  rootEmail: root@pnex.local
  persistence:
    size: 10Gi
    storageClass: ""
  # Cache sizes in MB.
  memoryCacheMaxSize: 512
  memoryCacheDatafusionMaxSize: 512
  memTableMaxSize: 256
  maxFileSizeInMemory: 128
  diskCacheMaxSize: 2048
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

# ── RustFS (S3-compatible store: firmware artefacts + media) ────────────
rustfs:
  image: rustfs/rustfs:1.0.0-rc.2
  bucket: pnex
  region: us-east-1
  persistence:
    size: 10Gi
    storageClass: ""
  # One-shot bucket creation (AWS CLI — no MinIO product in the stack).
  initImage: amazon/aws-cli:2.27.49
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }

# ── NetworkPolicy ───────────────────────────────────────────────────────
# Valkey, OpenObserve and RustFS only accept PNeX pods (needs a CNI that
# enforces policies: Calico, Cilium...).
networkPolicy:
  enabled: true

# ── Device edge (D153/D158) ─────────────────────────────────────────────
# Devices (firmware, edge agents) connect to their own TLS endpoint, which
# asks for the device client certificate (mTLS) and forwards it to the API.
# It cannot go through the Ingress: the controller would terminate TLS
# without the client certificate. A dedicated nginx behind a LoadBalancer
# Service serves `host` (DNS to point at the Service's external IP).
# Disabled = devices cannot connect (the API refuses device links that did
# not come through the edge).
deviceEdge:
  enabled: true
  # Host compiled into firmware builds. Default: devices.<publicHost>.
  host: ""
  replicas: 1
  image: nginxinc/nginx-unprivileged:1.29-alpine
  service:
    type: LoadBalancer
    # On a single-node cluster whose LoadBalancer is the node itself (k3s
    # ServiceLB), 443 is already taken by the ingress controller: use 4443.
    # A port other than 443 is appended to the host compiled into firmware.
    port: 443
    annotations: {}
    # Pin the external IP when the provider allows it (MetalLB, cloud LB).
    loadBalancerIP: ""
  # Server certificate of the device endpoint. Empty = a private CA and a
  # certificate for `host` are generated once and kept across upgrades
  # (Secret `<release>-device-edge-tls`, keys tls.crt/tls.key/ca.crt):
  # firmware then pins that CA instead of deviceCa.pem. Set it to a
  # kubernetes.io/tls Secret you manage (cert-manager...) to use a public
  # certificate; deviceCa.pem must then hold its root.
  tls:
    existingSecret: ""
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# ── Ingress ─────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations: {}
  # Access log of the browser websockets (/ws/*, on their own Ingress):
  # off by default (ingress-nginx, Traefik ≥ 3.1). Devices never use the
  # Ingress (see deviceEdge).
  wsAccessLog: false
  # TLS terminated by the ingress. Leave empty when TLS is terminated
  # upstream (Cloudflare proxy, external load balancer).
  tls: []
  #  - secretName: pnex-tls
