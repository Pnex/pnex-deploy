# PNeX Helm chart — default values.
#
# This repository is public: NEVER put a secret in a values file. Secrets
# are either generated in-cluster on first install (and kept across
# upgrades and uninstalls), or provided by you through `existingSecret`
# (e.g. rendered by sops / sealed-secrets / external-secrets).

# Public host name (no scheme). Browsers, apps and devices all use
# https://<publicHost>/ — TLS is terminated in front of the cluster
# (Cloudflare, a load balancer...) or by the ingress (`ingress.tls`).
publicHost: pnex.example.com

# Admin account: Rauthy bootstrap administrator + PNeX platform admin.
# Rauthy reads it on its very first start only (empty database).
admin:
  email: ""
  # Extra PNeX platform admins (comma separated), on top of admin.email.
  extraPlatformAdmins: ""

# Log verbosity of every PNeX / Rauthy / RustFS container.
logLevel: error

# ── Secrets ─────────────────────────────────────────────────────────────
# Keep real values in an encrypted values file (sops), never in plain text
# in git. Any value left empty is generated once in-cluster and then kept
# (the Secret is annotated `helm.sh/resource-policy: keep`): upgrades never
# rotate it. Rauthy's encryption key and raft secret must stay stable for
# the lifetime of its database.
secrets:
  # Use a Secret you manage yourself instead (same keys as the generated
  # `<release>-secrets`, see templates/secrets.yaml); all values below are
  # then ignored.
  existingSecret: ""
  # Rauthy bootstrap admin password: first start only, change it later from
  # the Rauthy account page.
  adminPassword: ""
  o2RootPassword: ""
  notifyInternalToken: ""
  flowRuntimeToken: ""
  # Shared by every API pod (internal flow-cluster routes, fail-closed).
  flowClusterToken: ""
  # Org secrets vault keyring, `k1:<base64 of 32 bytes>`. The server
  # refuses to start without it, and an org secret encrypted under a key
  # that is lost can never be read again: back it up (sops) with the
  # database backups. Rotation: `k2:<new>,k1:<old>`, upgrade, run the
  # re-encryption from the platform status page, then drop `k1`.
  secretsKeys: ""
  valkeyPassword: ""
  rustfsAccessKey: ""
  rustfsSecretKey: ""
  rauthySecretRaft: ""
  rauthySecretApi: ""
  # Encryption key: id = alphanumeric, key = base64 of 32 random bytes
  # (`openssl rand -base64 32`).
  rauthyEncKeyId: ""
  rauthyEncKey: ""
  # Bootstrap API key secret (>= 64 alphanumeric chars), used by the
  # branding job: `Authorization: API-Key pnex-install$<secret>`.
  rauthyApiKeySecret: ""
  # Shared secret the device edge adds to every request (`X-Pnex-Edge`):
  # the API trusts the edge's TLS and client-certificate headers only with
  # it (>= 16 chars). Generated when empty.
  edgeSecret: ""

# ── Outgoing mail (Rauthy: account activation, password reset) ─────────
smtp:
  enabled: false
  host: ""
  # 465 = implicit TLS, 587 = STARTTLS. Rauthy never sends in clear text.
  port: 465
  username: ""
  from: ""
  # Stored in the chart Secret (key smtp-password). Ignored when
  # secrets.existingSecret is set: put `smtp-password` in that Secret.
  password: ""
  # Prefix of every mail subject.
  subjectPrefix: PNeX

# ── Images ──────────────────────────────────────────────────────────────
image:
  registry: docker.io/shanisma
  # Defaults to .Chart.AppVersion (`latest` = last green main). Pin
  # `main-<sha>` for reproducible deployments.
  tag: ""
  pullPolicy: Always
imagePullSecrets: []

# ── pnex-server (HTTP API, websockets, web UI, flow runtime) ────────────
api:
  replicas: 1
  # Firmware always targets publicHost and users cannot register another
  # PNeX server (PNEX_PROD_HOST): a Kubernetes install is one public server.
  lockServerHost: true
  # Deployment mode: `self_hosted` (no subscription tiers) or `saas`.
  deploymentMode: self_hosted
  # Subscription tier (by name) given to new organizations; empty = the
  # server default ("Free"). Only enforced in `saas` mode; a platform admin
  # changes an org's tier later in /admin/status.
  defaultOrgTier: ""
  defaultRetentionDays: 30
  dbMaxConnections: 10
  # Several replicas share the flows (each org runs on exactly one pod) and
  # the HTTP/websocket traffic; size Postgres so that
  # replicas x (dbMaxConnections + 2) stays below postgres max_connections.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  rateLimit:
    enabled: true
    # CIDRs whose X-Forwarded-For is trusted to find the client IP. Empty =
    # the server default (private ranges: covers the ingress controller).
    # Behind a CDN, append its ranges so the limit applies per real client,
    # not per CDN edge (Cloudflare: https://www.cloudflare.com/ips/).
    trustedProxies: ""
  extraEnv: []

# ── Custom firmware IDE (user C++ compiled by the worker) ───────────────
# Off by default. The builder image ships no bubblewrap: `sandbox: none`
# runs user code in the worker container, which holds the database
# credentials. Enable only when every user of the platform is trusted.
customFirmware:
  enabled: false
  sandbox: bwrap

# ── Device CA (firmware wss pin, D70) ───────────────────────────────────
# PEM of the root CA that signs the device endpoint's certificate when it
# is a public one (deviceEdge.tls.existingSecret): every firmware pins it.
# Unused with the generated device edge certificate (its own CA is pinned). Default:
# ISRG Root X1 (Let's Encrypt, e.g. cert-manager). Behind Cloudflare, pin
# the root of its edge certificate instead (GTS Root R4 today):
#   --set-file deviceCa.pem=gts-root-r4.pem
# Size limit: 2047 bytes of PEM on ESP8266 (one root), 4095 on ESP32 (two
